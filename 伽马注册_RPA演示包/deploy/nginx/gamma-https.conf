# 域名 + HTTPS。替换 DOMAIN / 证书路径后使用。
# 1) 将 banli.example.com 换成真实域名
# 2) 证书放到 D:/gamma/certs/
# 3) 安全组放行 443；nginx -t && nginx -s reload

upstream gamma_uvicorn {
    server 127.0.0.1:8766;
    keepalive 8;
}

server {
    listen 80;
    server_name banli.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name banli.example.com;

    ssl_certificate     D:/gamma/certs/fullchain.pem;
    ssl_certificate_key D:/gamma/certs/privkey.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;

    location / {
        proxy_pass http://gamma_uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
